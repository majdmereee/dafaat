name: Build Windows App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # يتيح لك تشغيل البناء يدوياً من واجهة غيت هاب

jobs:
  build:
    runs-on: windows-latest # تحديد سيرفر ويندوز لتخريج ملف exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Build Electron App
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # تصريح البناء الخاص بغيت هاب

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Daily-Cash-App
          path: dist/*.exe # سحب ملف الـ exe بعد انتهاء البناء
